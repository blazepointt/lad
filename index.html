<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лад — тихое место для дел и мыслей</title>
    <meta
      name="description"
      content="Лад — персональное пространство: задачи, заметки, календарь, привычки и фокус-таймер. Все данные остаются только у вас."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Лад" />
    <script>
      // Ранняя установка темы до первой отрисовки, чтобы не было «вспышки»
      try {
        var s = (JSON.parse(localStorage.getItem('lad.v1') || '{}').settings) || {};
        var t = s.theme || 'auto';
        if (t === 'auto') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.accent = s.accent || 'terracotta';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.accent = 'terracotta';
      }
    </script>
